spring.application.name=sillon

# Puerto leído de la variable PORT, con 8080 por defecto
server.port=${PORT:8080}

# Conexión a base de datos (MySQL local / PostgreSQL en producción vía SPRING_DATASOURCE_URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sillon_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Importación opcional de secrets.properties desde la raíz
spring.config.import=optional:file:./secrets.properties

# Negocio y zona horaria
sillon.zona-horaria=America/Bogota
sillon.url-publica=${URL_PUBLICA:http://localhost:8080}
sillon.creditos.registro=10
sillon.creditos.plan-pro=300
sillon.creditos.paquete=200
sillon.limite.estilistas-gratis=2

# Seguridad y JWT
sillon.jwt.secreto=${JWT_SECRETO:clave_secreta_para_firmar_tokens_jwt_sillon_2026_super_segura_32_bytes_minimo}
sillon.jwt.expiracion-minutos=1440

# Stripe
sillon.stripe.clave-secreta=${STRIPE_CLAVE_SECRETA:sk_test_relleno}
sillon.stripe.secreto-webhook=${STRIPE_SECRETO_WEBHOOK:whsec_relleno}
sillon.stripe.precio-pro=${STRIPE_PRECIO_PRO:price_1UdggAF0OVCb0DiuE8ZeJBSV}
sillon.stripe.precio-creditos=${STRIPE_PRECIO_CREDITOS:price_1UdgiRF0OVCb0DiukjLarNzr}
sillon.stripe.url-api=${STRIPE_URL_API:https://api.stripe.com}

# IA (Gemini / OpenAI format)
sillon.ia.gemini.llave=${GEMINI_LLAVE:relleno_gemini_key}
sillon.ia.openai.url=${SILLON_IA_OPENAI_URL:https://generativelanguage.googleapis.com/v1beta/openai}
