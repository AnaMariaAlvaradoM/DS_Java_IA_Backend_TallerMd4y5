spring.application.name=sillon
spring.config.import=optional:file:./secrets.properties
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sillon_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
sillon.jwt.secreto=${JWT_SECRETO:}
sillon.url-publica=${URL_PUBLICA:${RENDER_EXTERNAL_URL:http://localhost:8080}}
sillon.stripe.api=${STRIPE_URL_API:https://api.stripe.com}
sillon.stripe.clave=${STRIPE_CLAVE_SECRETA:}
sillon.stripe.webhook=${STRIPE_SECRETO_WEBHOOK:}
sillon.stripe.pro=${STRIPE_PRECIO_PRO:}
sillon.stripe.creditos=${STRIPE_PRECIO_CREDITOS:}
sillon.ia.openai.url=${SILLON_IA_OPENAI_URL:https://generativelanguage.googleapis.com/v1beta/openai}
sillon.ia.clave=${GEMINI_LLAVE:}
sillon.ia.modelo=${SILLON_IA_MODELO:gemini-3.5-flash-lite}
sillon.zona=${SILLON_ZONA:America/Bogota}
server.error.include-message=never
sillon.ia.claude.url=${SILLON_IA_CLAUDE_URL:https://api.anthropic.com}
sillon.ia.claude.clave=${ANTHROPIC_API_KEY:}
sillon.ia.claude.modelo=${SILLON_IA_CLAUDE_MODELO:claude-haiku-4-5}
sillon.ia.entrada=${IA_USD_ENTRADA_MILLON:0.30}
sillon.ia.salida=${IA_USD_SALIDA_MILLON:2.50}
sillon.ia.claude.entrada=${CLAUDE_USD_ENTRADA_MILLON:1.00}
sillon.ia.claude.salida=${CLAUDE_USD_SALIDA_MILLON:5.00}
springdoc.swagger-ui.tags-sorter=alpha
