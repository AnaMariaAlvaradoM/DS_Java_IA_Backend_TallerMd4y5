spring.application.name=sillon

server.port=${PORT:8080}

# Credenciales locales guardadas fuera de Git
spring.config.import=optional:file:./secrets.properties

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Conexion a MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/sillon_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sillon_app}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# Configuracion del negocio
sillon.zona-horaria=America/Bogota
sillon.url-publica=${URL_PUBLICA:http://localhost:8080}

sillon.creditos-registro=10
sillon.creditos-pro=300
sillon.creditos-paquete=200
sillon.limite-estilistas-gratis=2

# JWT - valor de ejemplo solo para desarrollo
sillon.jwt.secreto=${JWT_SECRETO:CAMBIAR_ESTE_SECRETO_LOCAL_DE_32_CARACTERES}

# Stripe - valores de ejemplo
sillon.stripe.clave-secreta=${STRIPE_CLAVE_SECRETA:sk_test_REEMPLAZAR}
sillon.stripe.secreto-webhook=${STRIPE_SECRETO_WEBHOOK:whsec_REEMPLAZAR}
sillon.stripe.precio-pro=${STRIPE_PRECIO_PRO:price_REEMPLAZAR_PRO}
sillon.stripe.precio-creditos=${STRIPE_PRECIO_CREDITOS:price_REEMPLAZAR_CREDITOS}
sillon.stripe.url-api=${STRIPE_URL_API:https://api.stripe.com}

# Gemini mediante su API compatible con OpenAI
sillon.ia.openai.url=${SILLON_IA_OPENAI_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
sillon.ia.openai.llave=${GEMINI_LLAVE:REEMPLAZAR_LLAVE_GEMINI}