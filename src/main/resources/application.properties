
spring.application.name=sillon

# Puerto de la aplicacion
server.port=${PORT:8080}

# Conexion a MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sillon_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Persistencia JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Importacion opcional de configuracion privada
spring.config.import=optional:file:./secrets.properties


# Zona horaria del negocio
sillon.zona-horaria=America/Bogota


# URL publica de la API
sillon.url-publica=${URL_PUBLICA:http://localhost:8080}

# Reglas del negocio
sillon.creditos.registro=10
sillon.creditos.pro=300
sillon.creditos.paquete=200
sillon.estilistas.limite-gratis=2


# Seguridad JWT
sillon.jwt.secreto=${JWT_SECRETO:clave-temporal-desarrollo-sillon-cambiar-en-produccion}

# Stripe
sillon.stripe.clave-secreta=${STRIPE_CLAVE_SECRETA:sk_test_placeholder}
sillon.stripe.secreto-webhook=${STRIPE_SECRETO_WEBHOOK:whsec_placeholder}
sillon.stripe.precio-pro=${STRIPE_PRECIO_PRO:price_pro_placeholder}
sillon.stripe.precio-creditos=${STRIPE_PRECIO_CREDITOS:price_creditos_placeholder}
sillon.stripe.url-api=${STRIPE_URL_API:https://api.stripe.com}

# Inteligencia artificial
sillon.ia.gemini.llave=${GEMINI_LLAVE:clave-gemini-placeholder}
sillon.ia.openai.url=${SILLON_IA_OPENAI_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}

# Proveedor secundario: Claude (Anthropic)
sillon.ia.claude.llave=${CLAUDE_LLAVE:}
sillon.ia.claude.url=${CLAUDE_URL:https://api.anthropic.com/v1/messages}
sillon.ia.claude.modelo=${CLAUDE_MODELO:claude-sonnet-4-5}