spring.application.name=sillon

# -------------------------------------------------------------
# 1. Servidor e importación opcional de secretos
# -------------------------------------------------------------
server.port=${PORT:8080}
spring.config.import=optional:file:./secrets.properties

# -------------------------------------------------------------
# 2. Base de datos MySQL (Local con fallback a variables de entorno)
# -------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sillon_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# -------------------------------------------------------------
# 3. Constantes de negocio de Sillón
# -------------------------------------------------------------
sillon.zona-horaria=America/Bogota
sillon.url-publica=${URL_PUBLICA:http://localhost:8080}
sillon.negocio.creditos-registro=10
sillon.negocio.creditos-plan-pro=300
sillon.negocio.creditos-paquete=200
sillon.negocio.limite-estilistas-gratis=2

# -------------------------------------------------------------
# 4. Seguridad y JWT
# -------------------------------------------------------------
sillon.jwt.secreto=${JWT_SECRETO:un_secreto_por_defecto_de_al_menos_32_caracteres_relleno}

# -------------------------------------------------------------
# 5. Pasarela de pagos: Stripe
# -------------------------------------------------------------
sillon.stripe.url-api=${STRIPE_URL_API:https://api.stripe.com}
sillon.stripe.clave-secreta=${STRIPE_CLAVE_SECRETA:sk_test_placeholder}
sillon.stripe.secreto-webhook=${STRIPE_SECRETO_WEBHOOK:whsec_placeholder}
sillon.stripe.precio-pro=${STRIPE_PRECIO_PRO:price_placeholder_pro}
sillon.stripe.precio-creditos=${STRIPE_PRECIO_CREDITOS:price_placeholder_creditos}

# -------------------------------------------------------------
# 6. Proveedores de Inteligencia Artificial
# -------------------------------------------------------------
sillon.ia.gemini.llave=${GEMINI_LLAVE:placeholder}
sillon.ia.openai.url=${SILLON_IA_OPENAI_URL:https://generativelanguage.googleapis.com/v1beta/openai/}