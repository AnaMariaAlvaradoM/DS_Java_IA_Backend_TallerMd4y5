# CONFIGURACIÓN GENERAL Y SERVIDOR
# ==============================================================================
spring.application.name=sillon
server.port=${PORT:8080}

# Importación opcional de secretos locales desde la raíz del proyecto
spring.config.import=optional:file:./secrets.properties

# ==============================================================================
# BASE DE DATOS (MySQL) Y JPA
# =============================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sillon_db?createDatabaseIfNotExist=true&serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================================
# REGLAS Y PARÁMETROS DEL NEGOCIO
# ==============================================================================
sillon.negocio.zona-horaria=America/Bogota
sillon.api.url-publica=${API_URL_PUBLICA:http://localhost:8080}

sillon.negocio.creditos-registro=10
sillon.negocio.creditos-plan-pro=300
sillon.negocio.creditos-paquete=200
sillon.negocio.limite-estilistas-gratis=2

# ==============================================================================
# SEGURIDAD (JWT)
# ==============================================================================
# El valor de relleno tiene al menos 32 caracteres para cumplir con HS256 al arrancar
sillon.jwt.secreto= ""

# ==============================================================================
# INTEGRACIÓN STRIPE
# ==============================================================================
sillon.stripe.url-api=${STRIPE_URL_API:https://api.stripe.com}
sillon.stripe.clave-secreta=${STRIPE_API_KEY:sk_test_relleno_local}
sillon.stripe.webhook-secreto=${STRIPE_WEBHOOK_SECRET:whsec_relleno_local}
sillon.stripe.precio-pro-id=${STRIPE_PRECIO_PRO_ID:price_pro_relleno_local}
sillon.stripe.precio-paquete-id=${STRIPE_PRECIO_PAQUETE_ID:price_paquete_relleno_local}

# ==============================================================================
# INTEGRACIÓN IA (Gemini vía endpoint compatible con OpenAI)
# ==============================================================================
sillon.ia.gemini.api-key=${GEMINI_API_KEY:gemini_key_relleno_local}