spring.application.name=sillon
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


spring.config.import=optional:file:./secrets.properties


sillon.business.timezone=America/Bogota
sillon.api.public-url=${PUBLIC_URL:http://localhost:8080}

sillon.credits.registration=10
sillon.credits.plan-pro=300
sillon.credits.package=200
sillon.stylists.free-limit=2



stripe.secret-key=${STRIPE_CLAVE_SECRETA:${STRIPE_SECRET_KEY}}
stripe.url-api=${STRIPE_URL_API:https://api.stripe.com}
stripe.webhook-secret=${STRIPE_SECRETO_WEBHOOK:${STRIPE_WEBHOOK_SECRET}}
stripe.precio-pro=${STRIPE_PRECIO_PRO}
stripe.precio-paquete=${STRIPE_PRECIO_CREDITOS:${STRIPE_PRECIO_PAQUETE}}
stripe.url-publica=${URL_PUBLICA:http://localhost:8080}

sillon.ia.timeout-segundos=15
sillon.ia.max-tokens=1000

sillon.ia.openai.url=https://generativelanguage.googleapis.com/v1beta/openai
sillon.ia.openai.llave=${SILLON_IA_OPENAI_KEY:llave_falsa_por_defecto}
sillon.ia.openai.modelo=gemini-3.5-flash-lite
sillon.ia.openai.precio-entrada-millon=0.075
sillon.ia.openai.precio-salida-millon=0.30

sillon.ia.claude.url=${SILLON_IA_CLAUDE_URL:https://api.anthropic.com/v1/messages}
sillon.ia.claude.llave=${SILLON_IA_CLAUDE_KEY:llave_falsa_por_defecto}
sillon.ia.claude.modelo=claude-3-haiku-20240307
sillon.ia.claude.precio-entrada-millon=0.25
sillon.ia.claude.precio-salida-millon=1.25

jwt.expiration-ms=86400000