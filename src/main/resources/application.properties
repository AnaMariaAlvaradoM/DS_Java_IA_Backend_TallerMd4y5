# ============================================================
# Sillon - configuracion 
# ============================================================
spring.application.name=sillon

# --- Puerto: Render lo asigna con la variable PORT ---
server.port=${PORT:8080}

# --- Secretos locales (opcional: la app arranca aunque el archivo no exista) ---
spring.config.import=optional:file:./secrets.properties

# --- Base de datos: MySQL local; en Render se sobreescribe con SPRING_DATASOURCE_* ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sillon_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Zona horaria del negocio (el Clock de la Fase 1 la lee de aqui) ---
sillon.zona-horaria=America/Bogota
spring.jackson.time-zone=America/Bogota

# --- URL publica de la API (Stripe vuelve a /api/pagos/resultado sobre esta URL) ---
sillon.url-publica=${URL_PUBLICA:http://localhost:8080}

# --- Numeros del negocio ---
sillon.negocio.creditos-registro=10
sillon.negocio.creditos-plan-pro=300
sillon.negocio.creditos-paquete=200
sillon.negocio.limite-estilistas-gratis=2


# Configuración de Springdoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- JWT (el relleno solo sirve para que la app arranque; tiene mas de 32 caracteres) ---
sillon.jwt.secreto=${JWT_SECRETO:clave-local-de-desarrollo-minimo-32-caracteres}
sillon.jwt.expiracion-minutos=60


# --- Stripe (modo prueba). STRIPE_URL_API es configurable para que el calificador use su simulador ---
sillon.stripe.clave-secreta=${STRIPE_CLAVE_SECRETA:sk_test_placeholder}
sillon.stripe.secreto-webhook=${STRIPE_SECRETO_WEBHOOK:whsec_placeholder}
sillon.stripe.precio-pro=${STRIPE_PRECIO_PRO:price_pro_placeholder}
sillon.stripe.precio-creditos=${STRIPE_PRECIO_CREDITOS:price_creditos_placeholder}
sillon.stripe.url-api=${STRIPE_URL_API:https://api.stripe.com}


# --- IA ---
sillon.ia.gemini.llave=${GEMINI_LLAVE:gemini_placeholder}
sillon.ia.openai.url=${SILLON_IA_OPENAI_URL:https://generativelanguage.googleapis.com/v1beta/openai}
sillon.ia.openai.modelo=${SILLON_IA_OPENAI_MODELO:gemini-2.0-flash}
sillon.ia.openai.precio-entrada-millon=0.30
sillon.ia.openai.precio-salida-millon=2.50
sillon.ia.timeout-segundos=30
sillon.ia.max-tokens=1024

# Proveedor de respaldo Claude (para demostrar fallback en logs si falla el principal)
sillon.ia.claude.url=${SILLON_IA_CLAUDE_URL:https://api.anthropic.com}
sillon.ia.claude.modelo=${SILLON_IA_CLAUDE_MODELO:claude-3-haiku-20240307}
sillon.ia.claude.llave=${CLAUDE_LLAVE:sin-llave}
sillon.ia.claude.precio-entrada-millon=0.25
sillon.ia.claude.precio-salida-millon=1.25