spring.application.name=sillon
server.port=${PORT:8080}

# Secretos locales (opcional: la app arranca aunque no exista)
spring.config.import=optional:file:./secrets.properties

# Base de datos local (en Render las variables SPRING_DATASOURCE_* reemplazan esto)
spring.datasource.url=jdbc:mysql://localhost:3306/sillon_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Negocio
sillon.zona-horaria=America/Bogota
sillon.url-publica=${URL_PUBLICA:http://localhost:8080}
sillon.creditos.registro=10
sillon.creditos.plan-pro=300
sillon.creditos.paquete=200
sillon.plan.limite-estilistas-gratis=2

# JWT
sillon.jwt.secreto=${JWT_SECRETO:relleno-secreto-jwt-solo-para-desarrollo-local-123456}
sillon.jwt.expira-en-minutos=120

# Stripe
sillon.stripe.clave-secreta=${STRIPE_CLAVE_SECRETA:sk_test_relleno}
sillon.stripe.secreto-webhook=${STRIPE_SECRETO_WEBHOOK:whsec_relleno}
sillon.stripe.precio-pro=${STRIPE_PRECIO_PRO:price_relleno_pro}
sillon.stripe.precio-creditos=${STRIPE_PRECIO_CREDITOS:price_relleno_creditos}
sillon.stripe.url-api=${STRIPE_URL_API:https://api.stripe.com}

# IA
sillon.ia.timeout-segundos=${SILLON_IA_TIMEOUT_SEGUNDOS:20}
sillon.ia.max-tokens=${SILLON_IA_MAX_TOKENS:512}
sillon.ia.gemini.llave=${GEMINI_LLAVE:relleno}
sillon.ia.openai.url=${SILLON_IA_OPENAI_URL:https://generativelanguage.googleapis.com/v1beta/openai}
sillon.ia.openai.modelo=${SILLON_IA_OPENAI_MODELO:relleno-modelo}
sillon.ia.openai.precio-entrada-millon=0
sillon.ia.openai.precio-salida-millon=0
sillon.ia.claude.url=${SILLON_IA_CLAUDE_URL:https://api.anthropic.com}
sillon.ia.claude.modelo=${SILLON_IA_CLAUDE_MODELO:relleno-modelo-claude}
sillon.ia.claude.llave=${ANTHROPIC_LLAVE:relleno}
sillon.ia.claude.precio-entrada-millon=0
sillon.ia.claude.precio-salida-millon=0