spring.application.name=sillon

# Puerto: Render lo asigna con PORT
server.port=${PORT:8080}

# Secretos locales (opcional: la app arranca aunque no exista)
spring.config.import=optional:file:./secrets.properties

# Base de datos (MySQL local por defecto; Supabase en Render por variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sillon_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Negocio
sillon.zona-horaria=America/Bogota
sillon.url-publica=${URL_PUBLICA:http://localhost:8080}
sillon.creditos.registro=10
sillon.creditos.pro=300
sillon.creditos.paquete=200
sillon.plan-gratis.limite-estilistas=2

# JWT
sillon.jwt.secreto=${JWT_SECRETO:relleno-de-desarrollo-de-al-menos-32-caracteres-xx}
sillon.jwt.expira-minutos=120

# Stripe (modo prueba)
sillon.stripe.url-api=${STRIPE_URL_API:https://api.stripe.com}
sillon.stripe.clave-secreta=${STRIPE_CLAVE_SECRETA:sk_test_relleno}
sillon.stripe.secreto-webhook=${STRIPE_SECRETO_WEBHOOK:whsec_relleno}
sillon.stripe.precio-pro=${STRIPE_PRECIO_PRO:price_relleno_pro}
sillon.stripe.precio-creditos=${STRIPE_PRECIO_CREDITOS:price_relleno_creditos}

# IA (la URL se reemplaza solo con la variable SILLON_IA_OPENAI_URL)
sillon.ia.openai.url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
sillon.ia.openai.llave=${GEMINI_LLAVE:relleno}
sillon.ia.openai.modelo=gemini-2.5-flash
sillon.ia.claude.url=https://api.anthropic.com/v1/messages
sillon.ia.claude.llave=${CLAUDE_LLAVE:relleno}
sillon.ia.claude.modelo=claude-haiku-4-5
sillon.ia.timeout-segundos=20

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
