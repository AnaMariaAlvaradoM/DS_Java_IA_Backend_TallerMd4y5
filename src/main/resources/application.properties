spring.application.name=sillon

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sillon_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

jwt.secreto=${JWT_SECRETO:relleno-jwt-sillon-local-0123456789abcdef}

url.publica=${URL_PUBLICA:http://localhost:8080}
stripe.clave-secreta=${STRIPE_CLAVE_SECRETA:}
stripe.secreto-webhook=${STRIPE_SECRETO_WEBHOOK:}
stripe.precio-pro=${STRIPE_PRECIO_PRO:}
stripe.precio-creditos=${STRIPE_PRECIO_CREDITOS:}
stripe.url-api=${STRIPE_URL_API:https://api.stripe.com}

sillon.ia.timeout-segundos=30
sillon.ia.max-tokens=1024
sillon.ia.openai.url=https://generativelanguage.googleapis.com/v1beta/openai
sillon.ia.openai.modelo=gemini-3.5-flash-lite
sillon.ia.openai.llave=${GEMINI_LLAVE:relleno}
sillon.ia.openai.precio-entrada-millon=0.30
sillon.ia.openai.precio-salida-millon=2.50
sillon.ia.claude.url=https://api.anthropic.com
sillon.ia.claude.modelo=claude-haiku-5-5
sillon.ia.claude.llave=sin-configurar
sillon.ia.claude.precio-entrada-millon=0
sillon.ia.claude.precio-salida-millon=0

spring.config.import=optional:file:./secrets.properties
