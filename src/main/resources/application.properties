spring.application.name=sillon

# --- Servidor (Render asigna PORT; en local 8080) ---
server.port=${PORT:8080}

# --- Secretos locales (opcional: si no existe, la app arranca con los rellenos) ---
spring.config.import=optional:file:./secrets.properties

# --- Base de datos local (MySQL). En Render, SPRING_DATASOURCE_* la reemplazan ---
spring.datasource.url=jdbc:mysql://localhost:3306/sillon_db
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=5

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha

# --- Negocio ---
sillon.zona-horaria=America/Bogota
sillon.url-publica=${URL_PUBLICA:http://localhost:8080}
sillon.negocio.creditos-registro=10
sillon.negocio.creditos-pro=300
sillon.negocio.creditos-paquete=200
sillon.negocio.limite-estilistas-gratis=2

# --- JWT ---
sillon.jwt.secreto=${JWT_SECRETO:relleno-local-de-desarrollo-con-mas-de-32-caracteres}
sillon.jwt.expiracion-minutos=480

# --- Stripe (modo prueba) ---
sillon.stripe.url-api=${STRIPE_URL_API:https://api.stripe.com}
sillon.stripe.clave-secreta=${STRIPE_CLAVE_SECRETA:sk_test_sin_configurar}
sillon.stripe.secreto-webhook=${STRIPE_SECRETO_WEBHOOK:whsec_sin_configurar}
sillon.stripe.precio-pro=${STRIPE_PRECIO_PRO:price_sin_configurar}
sillon.stripe.precio-creditos=${STRIPE_PRECIO_CREDITOS:price_sin_configurar}

# --- IA ---
sillon.ia.timeout-segundos=20
# Proveedor principal: formato OpenAI apuntando a Gemini.
# El calificador la cambia con la variable de entorno SILLON_IA_OPENAI_URL.
sillon.ia.openai.url=https://generativelanguage.googleapis.com/v1beta/openai
sillon.ia.openai.llave=${GEMINI_LLAVE:sin-configurar}
sillon.ia.openai.modelo=gemini-3.5-flash-lite
sillon.ia.openai.precio-entrada-millon=0.30
sillon.ia.openai.precio-salida-millon=2.50
# Respaldo: formato Claude. Queda configurado aunque no haya llave (el fallback se ve en logs y termina en 503).
sillon.ia.claude.url=https://api.anthropic.com
sillon.ia.claude.llave=${CLAUDE_LLAVE:sin-configurar}
sillon.ia.claude.modelo=claude-haiku-4-5
sillon.ia.claude.precio-entrada-millon=1.00
sillon.ia.claude.precio-salida-millon=5.00
