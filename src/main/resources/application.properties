spring.application.name=sillon
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sillon}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


spring.config.import=optional:file:./secrets.properties


sillon.business.timezone=America/Bogota
sillon.api.public-url=${PUBLIC_URL:http://localhost:8080}

sillon.credits.registration=10
