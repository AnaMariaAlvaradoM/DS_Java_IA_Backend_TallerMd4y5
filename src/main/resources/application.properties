spring.application.name=sillon
¿
server.port=${PORT:8080}

spring.config.import=optional:file:./secrets.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sillon_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

sillon.zona-horaria=America/Bogota
sillon.url-publica=${URL_PUBLICA:http://localhost:8080}
sillon.creditos-registro=10
sillon.creditos-pro=300
sillon.creditos-paquete=200
sillon.limite-estilistas-gratis=2
sillon.ia.timeout-segundos=30
sillon.ia.max-tokens=1024
sillon.ia.openai.modelo=gemini-3.5-flash-lite
sillon.ia.openai.llave=${GEMINI_LLAVE:sin-configurar}
sillon.ia.openai.precio-entrada-millon=0.30
sillon.ia.openai.precio-salida-millon=2.50
sillon.ia.claude.url=http://localhost:11434
sillon.ia.claude.modelo=qwen3:1.7b
sillon.ia.claude.llave=ollama
sillon.ia.claude.precio-entrada-millon=0
sillon.ia.claude.precio-salida-millon=0


sillon.jwt.secreto=${JWT_SECRETO:sillon-secreto-local-para-desarrollo-12345678}
sillon.jwt.expiracion-minutos=1440


stripe.url-api=${STRIPE_URL_API:https://api.stripe.com}
stripe.clave-secreta=${STRIPE_CLAVE_SECRETA:sk_test_relleno}
stripe.secreto-webhook=${STRIPE_SECRETO_WEBHOOK:whsec_relleno}
