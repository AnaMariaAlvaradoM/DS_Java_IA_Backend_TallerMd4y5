spring.application.name=sillon

server.port=${PORT:8080}

spring.config.import=optional:file:./secrets.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3360/sillon_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Admin2026@}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

sillon.zona-horaria=America/Bogota
sillon.url-publica=${URL_PUBLICA:http://localhost:8080}

sillon.creditos.registro=10
sillon.creditos.pro=300
sillon.creditos.paquete=200
sillon.estilistas.limite-gratis=2

sillon.jwt.secreto=${JWT_SECRETO:relleno-jwt-no-usar-en-produccion-32}
sillon.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:480}

sillon.stripe.clave-secreta=${STRIPE_CLAVE_SECRETA:sk_test_relleno}
sillon.stripe.secreto-webhook=${STRIPE_SECRETO_WEBHOOK:whsec_relleno}
sillon.stripe.precio-pro=${STRIPE_PRECIO_PRO:price_pro_relleno}
sillon.stripe.precio-creditos=${STRIPE_PRECIO_CREDITOS:price_creditos_relleno}
sillon.stripe.url-api=${STRIPE_URL_API:https://api.stripe.com}

sillon.ia.gemini.llave=${GEMINI_LLAVE:relleno}
sillon.ia.openai.url=${SILLON_IA_OPENAI_URL:https://generativelanguage.googleapis.com/v1beta/openai}