
# ==========================================
# SECRETOS LOCALES
# ==========================================
spring.config.import=optional:file:./secrets.properties

# ==========================================
# SILLON - CONFIGURACION GENERAL
# ==========================================
spring.application.name=sillon
server.port=${PORT:8080}

# ==========================================
# BASE DE DATOS
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sillon_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ==========================================
# CONFIGURACION DEL NEGOCIO
# ==========================================
sillon.zona-horaria=America/Bogota
sillon.url-publica=${URL_PUBLICA:http://localhost:8080}

sillon.creditos.registro=10
sillon.creditos.pro=300
sillon.creditos.paquete=200
sillon.plan.gratis.max-estilistas=2

# ==========================================
# SEGURIDAD JWT
# ==========================================
sillon.jwt.secreto=${JWT_SECRETO:clave-local-de-desarrollo-minimo-32-caracteres}

# ==========================================
# STRIPE
# ==========================================
sillon.stripe.clave-secreta=${STRIPE_CLAVE_SECRETA:sk_test_placeholder}
sillon.stripe.secreto-webhook=${STRIPE_SECRETO_WEBHOOK:whsec_placeholder}
sillon.stripe.precio-pro=${STRIPE_PRECIO_PRO:price_pro_placeholder}
sillon.stripe.precio-creditos=${STRIPE_PRECIO_CREDITOS:price_creditos_placeholder}
sillon.stripe.url-api=${STRIPE_URL_API:https://api.stripe.com}

# ==========================================
# INTELIGENCIA ARTIFICIAL
# ==========================================
sillon.ia.openai.url=${SILLON_IA_OPENAI_URL:https://generativelanguage.googleapis.com/v1beta/openai}
sillon.ia.openai.llave=${GEMINI_LLAVE:gemini_placeholder}
