spring.application.name=sillon

server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

spring.config.import=optional:file:./secrets.properties

# Local: MySQL. En Render la URL debe ser el Session Pooler de Supabase, puerto 5432, con sslmode=require.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3360/sillon_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

sillon.zona-horaria=America/Bogota
sillon.url-publica=${URL_PUBLICA:http://localhost:8080}
sillon.proxy.direcciones=${SILLON_PROXY_DIRECCIONES:}

sillon.creditos.registro=10
sillon.creditos.pro=300
sillon.creditos.paquete=200
sillon.estilistas.limite-gratis=2

sillon.jwt.secreto=${JWT_SECRETO}
sillon.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:480}



sillon.stripe.clave-secreta=${STRIPE_CLAVE_SECRETA}
sillon.stripe.secreto-webhook=${STRIPE_SECRETO_WEBHOOK}
sillon.stripe.precio-pro=${STRIPE_PRECIO_PRO}
sillon.stripe.precio-creditos=${STRIPE_PRECIO_CREDITOS}
sillon.stripe.url-api=${STRIPE_URL_API:https://api.stripe.com}

sillon.ia.gemini.llave=${SILLON_IA_GEMINI_LLAVE:${GEMINI_LLAVE:}}

sillon.ia.openai.url=${SILLON_IA_OPENAI_URL:https://generativelanguage.googleapis.com/v1beta/openai}
sillon.ia.openai.modelo=${SILLON_IA_OPENAI_MODELO:gemini-3.8-flash}

sillon.ia.respaldo.url=${SILLON_IA_RESPALDO_URL:https://api.anthropic.com/v1/messages}
sillon.ia.respaldo.llave=${OPENAI_API_KEY:}
sillon.ia.respaldo.modelo=${SILLON_IA_RESPALDO_MODELO:claude-haiku-4-5-20251001}

sillon.ia.tiempo-conexion-ms=${SILLON_IA_TIEMPO_CONEXION_MS:5000}
sillon.ia.tiempo-respuesta-ms=${SILLON_IA_TIEMPO_RESPUESTA_MS:20000}
