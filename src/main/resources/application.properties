spring.application.name=sillon
server.port=${PORT:8080}
spring.config.import=optional:file:./secrets.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sillon_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.accept-float-as-int=false

sillon.zona-horaria=America/Bogota
sillon.url-publica=${URL_PUBLICA:http://localhost:8080}
sillon.creditos-registro=10
sillon.creditos-pro=300
sillon.creditos-paquete=200
sillon.limite-estilistas-gratis=2
sillon.jwt.secreto=${JWT_SECRETO:relleno-local-no-usar-en-produccion-0123456789}
sillon.jwt.expira-en-minutos=60

sillon.stripe.url-api=${STRIPE_URL_API:https://api.stripe.com}
sillon.stripe.clave-secreta=${STRIPE_CLAVE_SECRETA:sk_test_REEMPLAZAR}
sillon.stripe.secreto-webhook=${STRIPE_SECRETO_WEBHOOK:whsec_REEMPLAZAR}
sillon.stripe.precio-pro=${STRIPE_PRECIO_PRO:price_PRO_REEMPLAZAR}
sillon.stripe.precio-creditos=${STRIPE_PRECIO_CREDITOS:price_CREDITOS_REEMPLAZAR}

sillon.ia.openai.url=${SILLON_IA_OPENAI_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
sillon.ia.openai.llave=${GEMINI_LLAVE:REEMPLAZAR}
