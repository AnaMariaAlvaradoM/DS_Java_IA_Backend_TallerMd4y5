$kind: http-request
url: "{{baseUrl}}/api/salon"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('plan GRATIS', () => pm.expect(pm.response.json().plan).to.eql('GRATIS'));
    language: text/javascript
order: 3000
