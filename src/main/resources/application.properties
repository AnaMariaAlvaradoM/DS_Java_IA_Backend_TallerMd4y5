spring.application.name=sillon

# Servidor
server.port=${PORT:8080}

# Base de datos local
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sillon_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Persistencia
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Configuración privada opcional
spring.config.import=optional:file:./secrets.properties

# Zona horaria
sillon.zona-horaria=America/Bogota

# URL pública
sillon.url-publica=${URL_PUBLICA:http://localhost:8080}

# Reglas comerciales
sillon.creditos.registro=10
sillon.creditos.pro=300
sillon.creditos.paquete=200
sillon.limite-estilistas-gratis=2

# Seguridad JWT
sillon.jwt.secreto=${JWT_SECRETO:clave-de-ejemplo-para-desarrollo-cambiar-en-produccion}

# Stripe - modo prueba
sillon.stripe.clave-secreta=${STRIPE_CLAVE_SECRETA:sk_test_ejemplo}
sillon.stripe.secreto-webhook=${STRIPE_SECRETO_WEBHOOK:whsec_ejemplo}
sillon.stripe.precio-pro=${STRIPE_PRECIO_PRO:price_ejemplo_pro}
sillon.stripe.precio-creditos=${STRIPE_PRECIO_CREDITOS:price_ejemplo_creditos}
sillon.stripe.url-api=${STRIPE_URL_API:https://api.stripe.com}

# Inteligencia artificial
sillon.ia.gemini.llave=${GEMINI_LLAVE:clave_de_ejemplo}
sillon.ia.openai.url=${SILLON_IA_OPENAI_URL:https://generativelanguage.googleapis.com/v1beta/openai}
sillon.ia.tiempo-maximo=10s
sillon.ia.openai.llave=${sillon.ia.gemini.llave}
sillon.ia.openai.modelo=${SILLON_IA_OPENAI_MODELO:gemini-3.1-flash-lite}
# Tarifas por millon de tokens: Gemini en el plan gratuito del PDF.
# Si se habilita un plan de pago, configurar las tarifas del modelo contratado.
sillon.ia.openai.costo-entrada-millon=${SILLON_IA_OPENAI_COSTO_ENTRADA:0}
sillon.ia.openai.costo-salida-millon=${SILLON_IA_OPENAI_COSTO_SALIDA:0}
# Respaldo configurado incluso sin llave; nunca se registran sus credenciales.
sillon.ia.claude.url=${SILLON_IA_CLAUDE_URL:https://api.anthropic.com/v1}
sillon.ia.claude.llave=${CLAUDE_LLAVE:}
sillon.ia.claude.modelo=${SILLON_IA_CLAUDE_MODELO:claude-sonnet-4-6}
# Tarifa estandar Sonnet 4.6: https://platform.claude.com/docs/en/about-claude/pricing
sillon.ia.claude.costo-entrada-millon=${SILLON_IA_CLAUDE_COSTO_ENTRADA:3}
sillon.ia.claude.costo-salida-millon=${SILLON_IA_CLAUDE_COSTO_SALIDA:15}