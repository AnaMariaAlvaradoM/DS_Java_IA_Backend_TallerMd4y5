spring.application.name=sillon
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sillon_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:enginner}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Importación opcional del archivo de secretos desde la raíz (Clase 18)
spring.config.import=optional:file:./secrets.properties

# ==========================================
# CONFIGURACIÓN DEL NEGOCIO Y URLS PÚBLICAS
# ==========================================
sillon.business.timezone=America/Bogota
sillon.api.public-url=${PUBLIC_URL:http://localhost:8080}

sillon.credits.registration=10
sillon.credits.plan-pro=300
sillon.credits.package=200
sillon.stylists.free-limit=2

# ==========================================
# PROVEEDORES EXTERNOS (URLS CONFIGURABLES)
# ==========================================
# Dirección de Stripe (por defecto https://api.stripe.com o reemplazada por simulador)
sillon.stripe.api-url=${STRIPE_URL_API:https://api.stripe.com}

# Dirección del proveedor de IA en formato OpenAI (la de Gemini o reemplazada por simulador)
sillon.ia.openai.url=${SILLON_IA_OPENAI_URL:https://generativelanguage.googleapis.com/v1beta/openai/}

